[package]
name = "retopoez"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
tobj = "4"

[profile.dev]
opt-level = 2

[profile.release]
strip = true

[dev-dependencies]
naga = { version = "30.0.2", features = ["wgsl-in"] }
